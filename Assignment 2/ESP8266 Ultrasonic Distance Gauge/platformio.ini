; PlatformIO Project Configuration File
;
; ESP8266 Proximity Distance Meter with HC-SR04 and NewPing Library
; Hardware: NodeMCU ESP8266 + HC-SR04 + 4 LEDs
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

lib_deps = 
    teckel12/NewPing    ; NewPing library for ultrasonic sensors with median filtering
