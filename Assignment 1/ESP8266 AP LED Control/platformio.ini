; PlatformIO Project Configuration File
;
; ESP8266 NodeMCU - Wireless Access Point Mode
; Two LED Control via Web Server with LittleFS
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 921600

; Uncomment and modify if you need a specific port
;   Windows: COM3, COM4, etc.
;   Linux: /dev/ttyUSB0, /dev/ttyACM, etc.
;   macOS: /dev/cu.usbserial-*, /dev/cu.wchusbserial*

; upload_port = specify_port_here

upload_protocol = esptool
monitor_speed = 115200

; Use LittleFS instead of deprecated SPIFFS
board_build.filesystem = littlefs

build_flags =     
    ; Use LittleFS
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D VTABLES_IN_FLASH

